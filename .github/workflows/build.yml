name: Build

# Builds and tests signing-keys on Windows and Linux. The jar and the launchers
# (signing-keys.cmd and signing-keys.sh) are kept as a download on the run,
# so the tool can be tried without building it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8' # the oldest Java the tool supports
          cache: maven

      - name: Build and test
        run: mvn -B -ntp package

      # The jar is the same on both systems, so one run keeps it.
      - name: Keep the jar and the launchers
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: signing-keys-${{ github.sha }}
          path: |
            signing-keys.jar
            signing-keys.cmd
            signing-keys.sh
          if-no-files-found: error
          retention-days: 30

      - name: Keep the test reports when a test fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.os }}
          path: target/surefire-reports
